    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme (or the system one) before first paint, so a reload never flashes.
      // The header toggle changes it later (src/theme.ts uses the same 'theme' key).
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#111113');
      })();
    </script>

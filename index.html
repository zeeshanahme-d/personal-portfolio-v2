<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Name first: the page should answer a search for "Zeeshan Ahmed". Title ~50-60 chars, description ~150-160. -->
    <title>Zeeshan Ahmed | Frontend Developer, React &amp; Next.js</title>
    <meta
      name="description"
      content="Zeeshan Ahmed, frontend developer in Islamabad, Pakistan. CRMs, dashboards and admin panels built with React, Next.js and TypeScript. Open to frontend roles."
    />
    <link rel="canonical" href="https://zeeshanahmed.dev/" />
    <meta name="theme-color" content="#EEF0EA" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme (or the system one) before first paint, so a reload never flashes.
      // The header toggle changes it later (src/theme.ts uses the same 'theme' key).
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B1712');
      })();
    </script>
    <!-- The text font and the headline font, preloaded so neither paints in a fallback face first. -->
    <link rel="preload" href="/fonts/mona-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/besley.woff2" as="font" type="font/woff2" crossorigin />
